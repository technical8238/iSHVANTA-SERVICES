name: Enable GitHub Pages
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: write
jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages via REST
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.info(`Enabling Pages for ${owner}/${repo}`);
            const resp = await github.request('PUT /repos/{owner}/{repo}/pages', {
              owner,
              repo,
              source: { branch: 'gh-pages', path: '/' }
            });
            core.info(JSON.stringify(resp.data));