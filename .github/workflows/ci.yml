name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
        npm install

      - name: Build frontend
        run: |
          npm run build --if-present

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET backend
        run: |
          if [ -f backend/src/Ishavanta.Api/Ishavanta.Api.csproj ]; then
            dotnet restore backend/src/Ishavanta.Api/Ishavanta.Api.csproj
          else
            echo "No .NET project found, skipping restore"
          fi

      - name: Build .NET backend
        run: |
          if [ -f backend/src/Ishavanta.Api/Ishavanta.Api.csproj ]; then
            dotnet build backend/src/Ishavanta.Api/Ishavanta.Api.csproj --configuration Release --no-restore
          else
            echo "No .NET project found, skipping build"
          fi
